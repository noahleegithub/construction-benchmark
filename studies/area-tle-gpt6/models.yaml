models:
  - id: gw-gpt-6-astra
    provider: openai
    model: gpt-6-astra
    base_url: ${TAMU_GATEWAY_URL}
    api_key_env: TAMU_API_KEY
    temperature: null
    max_tokens: 32000
    token_param: max_completion_tokens
    detail: high
    input_cost_per_mtok: 10.00
    output_cost_per_mtok: 50.00
