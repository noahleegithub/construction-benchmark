models:
  - id: oracle
    provider: oracle
  - id: stub
    provider: stub
  - id: gw-gpt-6.1-sol
    provider: openai
    model: gpt-6.1-sol
    base_url: ${TAMU_GATEWAY_URL}
    api_key_env: TAMU_API_KEY
    temperature: null
    max_tokens: 32000
    token_param: max_completion_tokens
    detail: high
  - id: gw-gpt-5.6-sol
    provider: openai
    model: gpt-5.6-sol
    base_url: ${TAMU_GATEWAY_URL}
    api_key_env: TAMU_API_KEY
    temperature: null
    max_tokens: 32000
    token_param: max_completion_tokens
    detail: high
  - id: gw-gpt-5.6-luna
    provider: openai
    model: gpt-5.6-luna
    base_url: ${TAMU_GATEWAY_URL}
    api_key_env: TAMU_API_KEY
    temperature: null
    max_tokens: 32000
    token_param: max_completion_tokens
    detail: high
