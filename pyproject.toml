[project]
name = "takeoff-bench"
version = "0.1.0"
description = "A small, open harness for benchmarking models on construction drawing takeoff"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noah Lee" }]
dependencies = [
    "pymupdf>=1.24",
    "shapely>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.scripts]
takeoff-bench = "takeoff_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takeoff_bench"]

[dependency-groups]
dev = ["pytest>=8.0"]
